name: biznes-elektroniczny

services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  prestashop:
    image: prestashop/prestashop:8.2.8-8.1-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_SERVER: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWD: ${DB_PASSWORD}
      PS_INSTALL_AUTO: "1"
      PS_DOMAIN: localhost:${SHOP_HTTPS_PORT}
      PS_LANGUAGE: pl
      PS_COUNTRY: pl
      PS_FOLDER_ADMIN: ${PS_FOLDER_ADMIN}
      PS_ENABLE_SSL: "1"
      ADMIN_MAIL: ${ADMIN_MAIL}
      ADMIN_PASSWD: ${ADMIN_PASSWORD}
    volumes:
      - shop_data:/var/www/html
      - ./apache/forwarded-https.conf:/etc/apache2/conf-enabled/forwarded-https.conf:ro
  mailpit:
    image: axllent/mailpit:v1.31
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT}:8025"
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - prestashop
    ports:
      - "${SHOP_PORT}:80"
      - "${SHOP_HTTPS_PORT}:443"
    environment:
      SHOP_HTTPS_PORT: ${SHOP_HTTPS_PORT}
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./certs:/etc/nginx/certs:ro
  playwright:
    image: mcr.microsoft.com/playwright:v1.64.0-noble
    environment:
      - BASE_URL=https://localhost:${SHOP_HTTPS_PORT}
    working_dir: /testing/tests
    ipc: host
    ports:
      - "9323:9323"
    volumes:
      - ..:/testing
    command: sh -c "apt-get update && apt-get install -y socat && socat TCP-LISTEN:${SHOP_HTTPS_PORT},fork TCP:nginx:443 & npm install && tail -f /dev/null"
volumes:
  db_data:
  shop_data:
