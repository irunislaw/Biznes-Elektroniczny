# Sprawdzenia uruchamiane dla każdego PR. Nie scalamy PR z czerwonym CI (zasada w README).
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (ruff, pytest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scraper/requirements*.txt
      - name: Instalacja zależności
        run: pip install -r scraper/requirements-dev.txt
      - name: ruff
        run: ruff check --output-format=github scraper deploy
      - name: pytest
        run: pytest

  gitleaks:
    name: gitleaks (cała historia)
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Binarka z oficjalnego wydania zamiast gitleaks/gitleaks-action, który w repozytoriach
      # organizacji wymaga klucza licencji. Suma kontrolna chroni przed podmienionym plikiem.
      - name: Instalacja gitleaks
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      # Bez --log-opts gitleaks przegląda wszystkie commity ze wszystkich pobranych gałęzi.
      - name: gitleaks
        run: |
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --verbose .

  eslint:
    name: ESLint (tests/)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Instalacja zależności
        run: npm ci
      - name: eslint
        run: npm run lint