# Motyw potomny Classic. Szablony, JS i CSS dziedziczy po themes/classic,
# własne zmiany wyglądu są w assets/css/custom.css.
# Kopiowany do sklepu i włączany przez make init (deploy/config/theme.php).
name: gitara
display_name: Gitara
version: 1.0.0
parent: classic
author:
  name: "Zespół Biznes-Elektroniczny"

meta:
  compatibility:
    from: 8.2.1
    to: ~

  available_layouts:
    layout-full-width:
      name: Full Width
      description: No side columns, ideal for distraction-free pages such as product pages.
    layout-both-columns:
      name: Three Columns
      description: One large central column and 2 side columns.
    layout-left-column:
      name: Two Columns, small left column
      description: Two columns with a small left column
    layout-right-column:
      name: Two Columns, small right column
      description: Two columns with a small right column

assets:
  # theme.css i theme.js z themes/classic
  use_parent_assets: true

# Włączenie motywu zastępuje wszystkie typy miniatur tymi poniżej (PrestaShop czyści tabelę image_type),
# więc lista musi być identyczna jak w Classic, inaczej zdjęcia produktów i kategorii nie będą pasować.
# Sekcji hooks i modules celowo nie ma: przy włączeniu motywu PrestaShop przepiąłby moduły według
# tej listy i odpiął te podpięte przez deploy/config (np. becookiebanner).
global_settings:
  image_types:
    cart_default:
      width: 125
      height: 125
      scope: [ products ]
    small_default:
      width: 98
      height: 98
      scope: [ products, categories, manufacturers, suppliers ]
    medium_default:
      width: 452
      height: 452
      scope: [ products, manufacturers, suppliers ]
    home_default:
      width: 250
      height: 250
      scope: [ products ]
    large_default:
      width: 800
      height: 800
      scope: [ products, manufacturers, suppliers ]
    category_default:
      width: 141
      height: 180
      scope: [ categories ]
    stores_default:
      width: 170
      height: 115
      scope: [ stores ]

# Układy stron jak w Classic (kategoria z lewą kolumną filtrów).
theme_settings:
  default_layout: layout-full-width
  layouts:
    category: layout-left-column
    best-sales: layout-left-column
    new-products: layout-left-column
    prices-drop: layout-left-column
    contact: layout-left-column
